<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CableBox</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0907">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CableBox">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Dancing+Script:wght@600&family=VT323&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1f14b9b">
</head>
<body>
<div class="room">
  <div class="scene">

    <!-- This week's listings: the TV section, folded, lying on the console. Opens the newsprint grid. -->
    <a class="paper" id="paper" href="tvweek.html" target="_blank" rel="noopener" aria-label="TV Week listings">
      <span class="paper-mast">TV WEEK</span><span class="paper-line">Thursday's listings · page 4</span>
    </a>

    <!-- Cable converter box, on top of the set. A photograph; the LED digits and the hit targets are ours. -->
    <div class="cablebox" id="cablebox">
      <img class="box-photo" src="assets/box.webp" alt="" draggable="false">
      <button class="hit cb-power" id="power" aria-label="Power">Power</button>
      <button class="hit cb-zoom" id="zoom" aria-label="Zoom to the picture" title="Zoom (Z)">Zoom</button>
      <div class="cb-display" aria-label="channel display">
        <svg class="seg" id="seg0" viewBox="0 0 44 76" aria-hidden="true"></svg>
        <svg class="seg" id="seg1" viewBox="0 0 44 76" aria-hidden="true"></svg>
      </div>
      <div class="cb-marquee" id="boxMarquee" aria-label="now playing"></div>
      <div class="cb-keys" id="keys">
        <button class="hit" data-key="1" style="--c:0;--r:0" aria-label="1, Guide">1</button><button class="hit" data-key="2" style="--c:1;--r:0">2</button><button class="hit" data-key="3" style="--c:2;--r:0">3</button><button class="hit" data-key="up" style="--c:3;--r:0" aria-label="Channel up">CH up</button>
        <button class="hit" data-key="4" style="--c:0;--r:1">4</button><button class="hit" data-key="5" style="--c:1;--r:1">5</button><button class="hit" data-key="6" style="--c:2;--r:1">6</button><button class="hit" data-key="down" style="--c:3;--r:1" aria-label="Channel down">CH down</button>
        <button class="hit" data-key="7" style="--c:0;--r:2">7</button><button class="hit" data-key="8" style="--c:1;--r:2">8</button><button class="hit" data-key="9" style="--c:2;--r:2">9</button><button class="hit" data-key="0" style="--c:3;--r:2">0</button>
      </div>
    </div>

    <!-- The set. A photograph; the tube, the badge, the dial numbers, the knob labels, and the volume knob are ours. -->
    <div class="set">
      <img class="set-photo" src="assets/set.webp" alt="" draggable="false">
      <div class="screen-zone" aria-hidden="true"></div>
      <div class="glass off" id="glass">
        <div class="raster" id="raster"><div id="yt"></div></div>
        <canvas class="static" id="static" width="256" height="192"></canvas>
        <canvas class="scrambled" id="scrambled" width="320" height="240"></canvas>
        <div class="lower-third" id="lowerThird" aria-live="off"><div class="lt-artist"></div><div class="lt-song"></div><div class="lt-year"></div></div>
        <div class="standby" id="standby"><span>PLEASE<br>STAND BY</span></div>
        <div class="testpattern" id="testpattern"><div class="bars"></div><div class="bars2"></div><div class="signoff">CB-36 &nbsp;·&nbsp; OFF AIR</div></div>
        <div class="guide" id="guide">
          <div class="guide-head" id="guideHead"></div>
          <div class="guide-viewport"><div class="guide-rows" id="guideRows"></div></div>
        </div>
      </div>
      <img class="bezel" src="assets/bezel.webp" alt="" draggable="false">
      <div class="badge">HEATHKIT<span>25</span></div>
      <div class="dial" id="dialUHF"><svg viewBox="0 0 100 100" aria-hidden="true"></svg></div>
      <div class="dial vhf" id="dialVHF"><svg viewBox="0 0 100 100" aria-hidden="true"></svg></div>
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 60 40"><polygon points="30,4 46,28 14,28" fill="#d9642a"/><polygon points="30,4 14,28 4,28" fill="#2c6fb5"/><polygon points="30,4 56,28 46,28" fill="#7d8a3a"/></svg><span>25</span></div>
      <label class="knob-label" style="--x:80.5%;--y:31.4%">bright</label>
      <label class="knob-label" style="--x:91.7%;--y:31.0%">tint</label>
      <label class="knob-label" style="--x:80.3%;--y:39.2%">contrast</label>
      <label class="knob-label" style="--x:86.1%;--y:39.5%">volume</label>
      <label class="knob-label" style="--x:91.9%;--y:39.5%">color</label>
      <button class="hit knob-hit" id="volume" aria-label="Volume: scroll to adjust, click to mute"></button>
    </div>

    <!-- On a phone, the phone is the remote. -->
    <div class="remote" id="remote" aria-label="remote control">
      <div class="rm-top">
        <button class="rm-key rm-power" data-act="power" aria-label="Power">POWER</button>
        <div class="rm-display" aria-label="channel display"><svg class="seg" viewBox="0 0 44 76" aria-hidden="true"></svg><svg class="seg" viewBox="0 0 44 76" aria-hidden="true"></svg></div>
        <button class="rm-key rm-set" data-act="set" aria-label="Show the whole set">SET</button>
      </div>
      <div class="rm-marquee" id="remoteMarquee" aria-label="now playing"></div>
      <div class="rm-grid">
        <button class="rm-key" data-key="1"><span>1</span><small>GUIDE</small></button><button class="rm-key" data-key="2">2</button><button class="rm-key" data-key="3">3</button>
        <button class="rm-key" data-key="4">4</button><button class="rm-key" data-key="5">5</button><button class="rm-key" data-key="6">6</button>
        <button class="rm-key" data-key="7">7</button><button class="rm-key" data-key="8">8</button><button class="rm-key" data-key="9">9</button>
        <button class="rm-key ch" data-key="down">CH ▼</button><button class="rm-key" data-key="0">0</button><button class="rm-key ch" data-key="up">CH ▲</button>
      </div>
    </div>
    <button class="rm-toggle" id="remoteToggle" aria-label="Show the remote">REMOTE</button>
    <!-- Portrait phones: the remote lies on the TV section; the masthead peeks out below it. -->
    <a class="paper-under" id="paperUnder" href="tvweek.html" aria-label="TV Week listings"><span class="paper-mast">TV WEEK</span><span class="paper-line">this week's listings</span></a>
    <div id="safeProbe" aria-hidden="true"></div>
    <div class="zoom-controls" id="zoomControls" aria-label="zoomed-in controls">
      <button data-key="down" aria-label="Channel down">CH ▼</button><button data-key="up" aria-label="Channel up">CH ▲</button><button id="unzoom" aria-label="Show the whole set">⤢</button>
    </div>
    <div class="hint" id="hint">Turn the VOL/ON knob. Type a channel on the box, or use the keys. Guide is channel 1.</div>
  </div>
</div>
<script src="js/schedule.js?v=1f14b9b"></script>
<script src="js/player.js?v=1f14b9b"></script>
<script src="js/scramble.js?v=1f14b9b"></script>
<script src="js/marquee.js?v=1f14b9b"></script>
<script src="js/app.js?v=1f14b9b"></script>
</body>
</html>
